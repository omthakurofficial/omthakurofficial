<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Om Thakur - Tech Creator, Cloud and DevOps Trainer, AI Video Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="0.6" stop-color="#120b08"/>
      <stop offset="1" stop-color="#1f0e06"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#c2410c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c2410c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="320" rx="18" fill="url(#glow)"/>

  <!-- pipeline motif: prompt -> script -> scenes -> render -->
  <g transform="translate(650,86)" fill="none" stroke="url(#accent)" stroke-width="2">
    <rect x="0" y="0" width="100" height="56" rx="12" stroke-opacity="0.9"/>
    <rect x="135" y="0" width="100" height="56" rx="12" stroke-opacity="0.75"/>
    <rect x="270" y="0" width="100" height="56" rx="12" stroke-opacity="0.6"/>
    <rect x="405" y="0" width="100" height="56" rx="12" fill="#c2410c" fill-opacity="0.25"/>
    <path d="M100 28H135M235 28H270M370 28H405" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.6s" repeatCount="indefinite"/>
    </path>
  </g>
  <g font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="14" fill="#e5e7eb" text-anchor="middle">
    <text x="700" y="119">prompt</text>
    <text x="835" y="119">script</text>
    <text x="970" y="119">scenes</text>
    <text x="1105" y="119" fill="#fb923c" font-weight="600">render</text>
  </g>

  <!-- text -->
  <g font-family="'Segoe UI',Inter,Arial,sans-serif">
    <text x="64" y="120" font-size="22" fill="#fb923c" letter-spacing="6" font-weight="600">OM THAKUR</text>
    <text x="64" y="196" font-size="62" fill="#ffffff" font-weight="800">Tech Creator.</text>
    <text x="64" y="256" font-size="62" font-weight="800" fill="url(#accent)">Cloud &amp; AI Builder.</text>
  </g>
  <rect x="64" y="136" width="64" height="4" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="64;160;64" dur="4s" repeatCount="indefinite"/>
  </rect>
  <g font-family="'Segoe UI',Inter,Arial,sans-serif" font-size="16" fill="#9ca3af">
    <text x="700" y="250">DevOps trainer · AI video engineer · Kathmandu</text>
    <text x="700" y="278">omthakur.info.np</text>
  </g>
</svg>
